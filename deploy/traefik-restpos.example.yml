# Middleware de seguridad para el stack RestPost.
# Instalar en /etc/dokploy/traefik/dynamic/restpos-auth.yml del VPS.
# La autenticación de empleados vive en la aplicación; no se usa Basic Auth
# para que /pedir pueda abrirse al público.
http:
  middlewares:
    restpos-security:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
